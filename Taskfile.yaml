version: '3'

includes:
  remote: https://raw.githubusercontent.com/eoap/task-files/refs/tags/0.1.0/build-test/Taskfile.yaml
  local: Taskfile-local.yaml
  
tasks:

  docs:generate:uml:
    desc: Generate UML documentation
    cmds:
    - mkdir -p docs/design
    - |
      set -euo pipefail
      REPO_URL="$(git remote get-url origin)"
      for SRC_CWL in cwl-workflow/*.cwl; do
        WORKFLOW_ID="$(basename "${SRC_CWL}" .cwl)"
        uv run --no-project --with "transpiler-mate>=0.31.0" \
          transpiler-mate markdown \
          --workflow-id "${WORKFLOW_ID}" \
          --output docs/design \
          --code-repository "${REPO_URL}" \
          "${SRC_CWL}"
        uv run --no-project --with cwl2puml \
          cwl2puml \
          --workflow-id "${WORKFLOW_ID}" \
          --output "docs/design/${WORKFLOW_ID}" \
          --convert-image \
          --image-format svg \
          "${SRC_CWL}"
      done

      find docs/design -type f -name '*.puml' -delete



  build:
  - task: remote:build

  build-debug:
    cmds: 
    - defer: rm -f skaffold-auto.yaml
    - task: remote:prepare-kaniko
    - |
      skaffold build -f skaffold-auto.yaml 

  build-ttl:
  - task: remote:build-ttl

  prepare:
  - task: remote:prepare-kaniko

  test:
  - task: remote:test
  
  pattern-1:
  - task: local:pattern-1-wrap
  - task: remote:test-by-index
    vars:
      VAR: 0

  pattern-2:
  - task: local:pattern-2-wrap
  - task: remote:test-by-index
    vars:
      VAR: 1

  pattern-3:
  - task: local:pattern-3-wrap
  - task: remote:test-by-index
    vars:
      VAR: 2

  pattern-4:
  - task: local:pattern-4-wrap
  - task: remote:test-by-index
    vars:
      VAR: 3

  pattern-5:  
