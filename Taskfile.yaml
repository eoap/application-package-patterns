version: '3'
tasks:
  wrap:
    desc: Compose all twelve patterns using eoap-cwlwrap and published mastering staging
    cmds:
      - python scripts/wrap-pattern.py
  cwl:docs:
    cmds:
      - python scripts/cwl-docs.py --validate --output /tmp/patterns-cwl-docs
  test:
    desc: Execute the twelve patterns and four optional-port cases using Calrissian and real EO data
    cmds:
      - python scripts/check-release.py
      - python scripts/run-acceptance.py
  test:contracts:
    cmds:
      - python scripts/check-release.py
      - python scripts/cwl-docs.py --validate --output /tmp/patterns-cwl-docs
      - cd runner && python -m nose2 -v
  docs:
    cmds:
      - mkdocs build --strict
  pattern-1:
    cmds:
      - python scripts/run-acceptance.py --case pattern-1
  pattern-2:
    cmds:
      - python scripts/run-acceptance.py --case pattern-2
  pattern-3:
    cmds:
      - python scripts/run-acceptance.py --case pattern-3
  pattern-4:
    cmds:
      - python scripts/run-acceptance.py --case pattern-4
  pattern-5:
    cmds:
      - python scripts/run-acceptance.py --case pattern-5
  pattern-6:
    cmds:
      - python scripts/run-acceptance.py --case pattern-6
  pattern-7:
    cmds:
      - python scripts/run-acceptance.py --case pattern-7
  pattern-8:
    cmds:
      - python scripts/run-acceptance.py --case pattern-8
  pattern-9:
    cmds:
      - python scripts/run-acceptance.py --case pattern-9
  pattern-10:
    cmds:
      - python scripts/run-acceptance.py --case pattern-10
  pattern-11:
    cmds:
      - python scripts/run-acceptance.py --case pattern-11
  pattern-12:
    cmds:
      - python scripts/run-acceptance.py --case pattern-12
