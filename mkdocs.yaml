site_name: Application Packages patterns
repo_url: https://github.com/eoap/application-package-patterns/
repo_name: eoap/application-package-patterns

theme:
    logo: imgs/icon-eoap.png
    name: readthedocs

    palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
plugins:
  - search
  - mermaid2:
      version: 10.6.0
  - mkdocs-jupyter:
      execute: true
      show_input: False
      no_input: True

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span
extra_css:
  - styles/css/app.css
  
extra_javascript:
  - javascripts/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  

nav:
  - Introduction: 'index.md'
  - Pattern 1: pattern-1.md
  - Pattern 2: pattern-2.md
  - Pattern 3: pattern-3.md
  - Pattern 4: pattern-4.md
  - Pattern 5: pattern-5.md
  - Pattern 6: pattern-6.md
  - Pattern 7: pattern-7.md
  - Pattern 8: pattern-8.md
  - Pattern 9: pattern-9.md
  - Pattern 10: pattern-10.md
  - Pattern 11: pattern-11.md
  - Pattern 12: pattern-12.md

copyright: <a href="https://www.apache.org/licenses/LICENSE-2.0"><img src="https://img.shields.io/badge/license-Apache%20License%202.0-blue"" alt="Apache License, Version 2.0" /></a>
