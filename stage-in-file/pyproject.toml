[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stage-in-file"
dynamic = ["version"]
description = "Stage a remote file from a URL into the local workspace."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click",
  "planetary-computer",
  "requests",
]

[project.urls]
Documentation = "https://github.com/eoap/application-package-patterns#readme"
Issues = "https://github.com/eoap/application-package-patterns/issues"
Source = "https://github.com/eoap/application-package-patterns"

[tool.hatch.version]
path = "src/stage_in_file/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/stage_in_file tests}"

[tool.coverage.run]
source_pkgs = ["stage_in_file", "tests"]
branch = true
parallel = true
omit = [
  "src/stage_in_file/__about__.py",
]

[tool.coverage.paths]
stage_in_file = ["src/stage_in_file", "*/stage-in-file/src/stage_in_file"]
tests = ["tests", "*/stage-in-file/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[project.scripts]
stage-in-file = "stage_in_file.app:cli"
