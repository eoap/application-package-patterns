name: docs
on:
  push:
    branches: [main, develop]
    paths: ['docs/**', 'mkdocs.yaml', 'requirements-notebooks.txt', '.github/workflows/docs.yaml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.12 .venv
      - run: uv pip sync --python .venv/bin/python --require-hashes requirements-notebooks.txt
      - run: .venv/bin/mkdocs gh-deploy --force --strict
