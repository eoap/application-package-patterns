name: Acceptance and release
on:
  push:
    branches: [main, develop, feature/pde-typed-cwl]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the accepted stable 2.0.0 from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: patterns-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the hash-locked environment and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman graphviz
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements-notebooks.txt
          uv pip check --python .venv/bin/python
      - name: Validate release contracts and wrapper API
        run: |
          .venv/bin/python scripts/check-release.py
          .venv/bin/python scripts/cwl-docs.py --validate --output acceptance-results/cwl-docs
          .venv/bin/python scripts/wrap-pattern.py --output acceptance-results/wrapped
          for cwl in acceptance-results/wrapped/*.cwl; do .venv/bin/cwltool --validate "$cwl"; done
      - name: Start authenticated disposable S3
        run: |
          printf '%s' '{"identities":[{"name":"test","credentials":[{"accessKey":"test","secretKey":"test"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name patterns-s3 -p 8333:8333 -v /tmp/s3.json:/etc/seaweedfs/s3.json:ro chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/seaweedfs/s3.json
          endpoint="http://$(hostname -I | awk '{print $1}'):8333"
          echo "PATTERNS_S3_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          PATTERNS_S3_ENDPOINT="$endpoint" .venv/bin/python scripts/prepare-s3.py
      - name: Execute all sixteen real-data wrapped cases and verify S3
        run: |
          source .venv/bin/activate
          python scripts/run-acceptance.py --runner cwltool --output "$GITHUB_WORKSPACE/acceptance-results/workflows"
      - name: Build documentation strictly
        run: .venv/bin/mkdocs build --strict --site-dir acceptance-results/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ github.sha }}
          path: acceptance-results/

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-${{ github.sha }}
          path: accepted
      - uses: oras-project/setup-oras@v1
      - name: Prepare all unchanged validated assets before publication
        run: |
          version=$(jq -er .version codemeta.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "$version" >/dev/null 2>&1; then echo 'Version already published'; exit 1; fi
          mkdir release-assets
          cp cwl-workflow/*.cwl cwl-workflow/*-inputs.json requirements-notebooks.txt mastering-staging.lock.json release-assets/
          cp -r templates release-assets/
          mkdir release-assets/wrapped
          cp accepted/wrapped/*.cwl release-assets/wrapped/
          cd release-assets
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish standalone and wrapped CWL to GHCR
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for cwl in release-assets/pattern-*.cwl release-assets/test-*.cwl; do
            name=$(basename "$cwl" .cwl)
            oras push "ghcr.io/eoap/application-package-patterns/cwl/$name:$VERSION" --artifact-type application/cwl "$cwl:application/cwl"
          done
          for cwl in release-assets/wrapped/*.cwl; do
            name=$(basename "$cwl" .cwl)
            oras push "ghcr.io/eoap/application-package-patterns/cwl/$name-wrapped:$VERSION" --artifact-type application/cwl "$cwl:application/cwl"
          done
      - name: Publish stable GitHub release
        run: |
          tar -czf application-package-patterns.$VERSION.tar.gz -C release-assets .
          gh release create "$VERSION" application-package-patterns.$VERSION.tar.gz --target "$GITHUB_SHA" --title "Application Package Patterns $VERSION" --notes-file RELEASE_NOTES.md
