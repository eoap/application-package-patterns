name: Acceptance and release
on:
  push:
    branches: [main, develop, feature/pde-typed-cwl]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the accepted version from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: patterns-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the hash-locked environment and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman graphviz
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements/development.txt
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e . -e runner
          uv pip check --python .venv/bin/python
      - name: Validate release contracts and wrapper API
        run: |
          .venv/bin/python scripts/check-release.py
          .venv/bin/python scripts/cwl-docs.py --validate --output acceptance-results/cwl-docs
          .venv/bin/python scripts/wrap-pattern.py --output acceptance-results/wrapped
          for cwl in acceptance-results/wrapped/*.cwl; do .venv/bin/cwltool --validate "$cwl"; done
      - name: Validate portable release OCI metadata
        run: |
          uv venv --python 3.12 .oci-venv
          uv pip sync --python .oci-venv/bin/python --require-hashes requirements-oci.txt
          source .oci-venv/bin/activate
          python scripts/prepare-oci.py --source-dir cwl-workflow --wrapped-dir acceptance-results/wrapped --output acceptance-results/annotations --revision "$GITHUB_SHA" --version "$(jq -er .version codemeta.json)"
      - name: Test the processing runner
        run: |
          .venv/bin/python -m pytest -q
      - name: Build the exact candidate processing runtime
        run: |
          mkdir -p acceptance-results/runtime
          docker build -t ghcr.io/eoap/application-package-patterns/runner:acceptance runner
          docker save -o acceptance-results/runtime/runner.tar ghcr.io/eoap/application-package-patterns/runner:acceptance
          podman load -i acceptance-results/runtime/runner.tar
      - name: Start authenticated disposable S3
        run: |
          printf '%s' '{"identities":[{"name":"test","credentials":[{"accessKey":"test","secretKey":"test"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name patterns-s3 -p 8333:8333 -v /tmp/s3.json:/etc/seaweedfs/s3.json:ro chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/seaweedfs/s3.json
          endpoint="http://$(hostname -I | awk '{print $1}'):8333"
          echo "PATTERNS_S3_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          PATTERNS_S3_ENDPOINT="$endpoint" .venv/bin/python scripts/prepare-s3.py
      - name: Execute all sixteen real-data wrapped cases and verify S3
        run: |
          source .venv/bin/activate
          python scripts/run-acceptance.py --processing-image ghcr.io/eoap/application-package-patterns/runner:acceptance --runner cwltool --output "$GITHUB_WORKSPACE/acceptance-results/workflows"
      - name: Build documentation strictly
        run: .venv/bin/mkdocs build --strict --site-dir acceptance-results/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ github.sha }}
          path: acceptance-results/

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-${{ github.sha }}
          path: accepted
      - uses: oras-project/setup-oras@v1
      - uses: astral-sh/setup-uv@v6
      - name: Prepare all unchanged validated assets before publication
        run: |
          version=$(jq -er .version codemeta.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "$version" >/dev/null 2>&1; then echo 'Version already published'; exit 1; fi
          mkdir release-assets
          cp cwl-workflow/*.cwl cwl-workflow/*-inputs.json requirements-notebooks.txt requirements-oci.txt mastering-staging.lock.json release-assets/
          cp -r templates requirements release-assets/
          mkdir release-assets/wrapped
          cp accepted/wrapped/*.cwl release-assets/wrapped/
          cp -r accepted/annotations release-assets/
          uv venv --python 3.12 .oci-venv
          uv pip sync --python .oci-venv/bin/python --require-hashes requirements-oci.txt
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements/development.txt
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e . -e runner
          cd release-assets
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Refuse to replace any existing CWL artifact
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for cwl in release-assets/pattern-*.cwl release-assets/test-*.cwl; do
            name=$(basename "$cwl" .cwl)
            if oras resolve "ghcr.io/eoap/application-package-patterns/cwl/$name:$VERSION" >/dev/null 2>&1; then
              echo "Artifact already exists: $name:$VERSION"; exit 1
            fi
          done
          for cwl in release-assets/wrapped/*.cwl; do
            name=$(basename "$cwl" .cwl)
            if oras resolve "ghcr.io/eoap/application-package-patterns/cwl/$name-wrapped:$VERSION" >/dev/null 2>&1; then
              echo "Artifact already exists: $name-wrapped:$VERSION"; exit 1
            fi
          done
      - name: Publish the exact accepted processing archive
        run: |
          image="ghcr.io/eoap/application-package-patterns/runner:$VERSION"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if oras resolve "$image" >/dev/null 2>&1; then echo "Image tag already published"; exit 1; fi
          docker load -i accepted/runtime/runner.tar
          docker tag ghcr.io/eoap/application-package-patterns/runner:acceptance "$image"
          docker push "$image"
          digest=$(oras resolve "$image")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="ghcr.io/eoap/application-package-patterns/runner@$digest"
          .venv/bin/python -m patterns.release --image "$reference" --directory release-assets
          printf '%s\n' "$reference" > release-assets/processing-image.txt
          .venv/bin/python scripts/cwl-docs.py --source release-assets --validate --output accepted/published-cwl-docs
          .oci-venv/bin/python scripts/prepare-oci.py --source-dir release-assets --wrapped-dir release-assets/wrapped --output release-assets/annotations --revision "$GITHUB_SHA" --version "$VERSION"
      - name: Publish and verify standalone and wrapped CWL on GHCR
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          : > release-assets/oci-artifacts.txt
          for cwl in release-assets/pattern-*.cwl release-assets/test-*.cwl release-assets/wrapped/*.cwl; do
            name=$(basename "$cwl" .cwl)
            if [[ "$cwl" == */wrapped/* ]]; then name="$name-wrapped"; fi
            file=$(basename "$cwl")
            annotations="$GITHUB_WORKSPACE/release-assets/annotations/$name.annotations.json"
            target="ghcr.io/eoap/application-package-patterns/cwl/$name:$VERSION"
            (cd "$(dirname "$cwl")" && oras push "$target" --artifact-type application/cwl --annotation-file "$annotations" "$file:application/cwl")
            digest=$(oras resolve "$target")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            reference="ghcr.io/eoap/application-package-patterns/cwl/$name@$digest"
            oras manifest fetch "$reference" > /tmp/patterns-manifest.json
            jq -e --slurpfile expected "$annotations" '.annotations as $actual | $expected[0]."$manifest" | to_entries | all(.[]; $actual[.key] == .value)' /tmp/patterns-manifest.json
            mkdir -p "/tmp/verified/$name"
            oras pull "$reference" -o "/tmp/verified/$name"
            cmp "$cwl" "/tmp/verified/$name/$file"
            entrypoint=$(jq -er '."$manifest"."org.cwl.entrypoint"' "$annotations")
            .oci-venv/bin/cwltool --validate "/tmp/verified/$name/$entrypoint"
            printf '%s\n' "$reference" >> release-assets/oci-artifacts.txt
          done
      - name: Publish stable GitHub release
        run: |
          (cd release-assets && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf application-package-patterns.$VERSION.tar.gz -C release-assets .
          gh release create "$VERSION" application-package-patterns.$VERSION.tar.gz --target "$GITHUB_SHA" --title "Application Package Patterns $VERSION" --notes-file RELEASE_NOTES.md
