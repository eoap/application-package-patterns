name: build
on:
  push:
    branches:
    - develop
    - fixes
    - main
    tags:
    - 'v*.*.*'

    paths:
    # Only rebuild website when apps have changed
    - 'cwl-workflow/**'
    - 'templates/**'
    - .github/**
    - runner/**
    - stage-in/**
    - stage-in-file/**
    - stage-out/**
    - codemeta.json
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        step: [pattern-1, pattern-2, pattern-3, pattern-4, pattern-5, pattern-6, pattern-7, pattern-8, pattern-9, pattern-10, pattern-11, pattern-12, test-primitives, test-custom-types]
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with:
        python-version: 3.x
    - run: pip install cwltool
    - run: cwltool --validate cwl-workflow/${{ matrix.step }}.cwl

  version:
    needs: validate

    runs-on: ubuntu-latest

    outputs:
      app-version: ${{ steps.set-version.outputs.version }}
      publish-tag: ${{ steps.set-publish-tag.outputs.publish_tag }}

    steps:
    - uses: actions/checkout@v2
    - run: echo "APP_VERSION=$(cat codemeta.json | jq -r .version )" >> $GITHUB_ENV
    - run: echo app version is $APP_VERSION
    - id: set-version
      run: echo "::set-output name=version::$APP_VERSION"
    - id: set-publish-tag
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          publish_tag="${GITHUB_REF_NAME#v}"
        elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
          publish_tag="latest"
        elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
          publish_tag="latest-dev"
        else
          publish_tag="${GITHUB_REF_NAME}"
        fi
        echo "publish_tag=${publish_tag}" >> "$GITHUB_OUTPUT"

  test-runner:
    needs: version

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with:
        python-version: 3.x
    - run: |
        pip install .
        cd runner
        pip install .
        pip install nose2
    - run: |
        cd runner
        nose2

  container-build:
    if: github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v')

    needs: 
    - version
    - test-runner

    runs-on: ubuntu-latest

    strategy:
      matrix:
        step: ['runner', 'stage-in', 'stage-in-file', 'stage-out']

    steps:
    - uses: actions/checkout@v2
    - run: echo publish tag ${{needs.version.outputs.publish-tag}}
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: build & push image
      run: |
        IMAGE_ID=ghcr.io/eoap/application-package-patterns/${{ matrix.step }}
        docker build ${{ matrix.step }} --file ${{ matrix.step }}/Dockerfile --tag ${{ matrix.step }}
        docker tag ${{ matrix.step }} $IMAGE_ID:${{needs.version.outputs.publish-tag}}
        docker push $IMAGE_ID:${{needs.version.outputs.publish-tag}}

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
    - container-build
    - version

    runs-on: ubuntu-latest

    outputs:

      upload_url: ${{ steps.set-upload-url.outputs.upload_url }}

    steps:
    - name: release
      uses: actions/create-release@v1
      id: create_release
      with:
        draft: false
        prerelease: false
        release_name: ${{needs.version.outputs.publish-tag}}
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - id: set-upload-url
      run: echo "::set-output name=upload_url::${{ steps.create_release.outputs.upload_url }}"

  publish-artifacts:

    needs:
    - create-release
    - version

    runs-on: ubuntu-latest

    strategy:
      matrix:
        step: [pattern-1, pattern-2, pattern-3, pattern-4, pattern-5, pattern-6, pattern-7, pattern-8, pattern-9, pattern-10, pattern-11, pattern-12, test-primitives, test-custom-types]

    steps:
    - uses: actions/checkout@v2
    - run: |
        set -x
        tag="ghcr.io/eoap/application-package-patterns/runner:${{needs.version.outputs.publish-tag}}"
        docker pull ${tag}
        shatag=$( docker inspect ${tag} | yq -r '.[0]["RepoDigests"][0]' )
        s="clt" t="${shatag}" yq -i eval '(.$graph[] | select (.id == env(s)) ).requirements.DockerRequirement.dockerPull = env(t)' cwl-workflow/${{matrix.step}}.cwl
    - run: |
        set -x
        r=$( cat codemeta.json | jq -r ".codeRepository" ) yq -i eval '."s:codeRepository" = {"URL" : env(r)}' cwl-workflow/${{matrix.step}}.cwl
        v="${{needs.version.outputs.publish-tag}}" yq -i eval '."s:softwareVersion" = env(v)' cwl-workflow/${{matrix.step}}.cwl
        #n=$(cat codemeta.json | jq -r '(.author[0].givenName + " " + .author[0].familyName)') \
        #e=$(cat codemeta.json | jq -r '.author[0].email') \
        #a=$(cat codemeta.json | jq -r '.author[0].affiliation["name"]') \
        #yq eval -i  '."s:author" += [{"class": "s:Person", "s.name": env(n), "s.email": env(e), "s.affiliation": env(a)}]' cwl-workflow/${{matrix.step}}.cwl
    - name: Cleanup downloads folder
      run: rm -rf downloads/*
    - run: |
        mkdir -p downloads
        cp cwl-workflow/${{matrix.step}}.cwl downloads/${{matrix.step}}.${{needs.version.outputs.publish-tag}}.cwl
        
    - uses: actions/upload-artifact@v4
      with:
        name: application-package-${{matrix.step}}
        path: downloads
        overwrite: true
    - name: upload linux artifact 1
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        upload_url: ${{needs.create-release.outputs.upload_url}}
        asset_path: downloads/${{matrix.step}}.${{needs.version.outputs.publish-tag}}.cwl
        asset_name: ${{matrix.step}}.${{needs.version.outputs.publish-tag}}.cwl
        asset_content_type: text/yaml
    
    - name: Setup ORAS CLI
      uses: oras-project/setup-oras@v1
    
    - name: Push CWL as OCI Artifact to GHCR
      run: |
        set -x
        cd downloads
        FILE=${{matrix.step}}.${{needs.version.outputs.publish-tag}}.cwl
        NAME=ghcr.io/eoap/application-package-patterns/${{matrix.step}}:${{needs.version.outputs.publish-tag}}
        
        echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

        oras push "$NAME" \
          --artifact-type application/cwl \
          "$FILE:application/cwl"

    - name: Push CWL as OCI Artifact to harbor
      run: |
        set -x
        cd downloads
        FILE=${{matrix.step}}.${{needs.version.outputs.publish-tag}}.cwl
        NAME=${{ secrets.CR_REPO }}/${{ secrets.CR_PROJECT }}/${{matrix.step}}:${{needs.version.outputs.publish-tag}}

        echo "${{ secrets.CR_PASSWORD }}" | oras login "${{ secrets.CR_REPO }}" -u "${{ secrets.CR_USERNAME }}" --password-stdin

        oras push "$NAME" \
          --artifact-type application/cwl \
          "$FILE:application/cwl"

  publish-template-artifacts:

    needs:
    - create-release
    - version

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
        - template_id: stage-in-template
          template_file: templates/stage-in.cwl
          image_name: stage-in
        - template_id: stage-in-file-template
          template_file: templates/stage-in-file.cwl
          image_name: stage-in-file
        - template_id: stage-out-template
          template_file: templates/stage-out.cwl
          image_name: stage-out

    steps:
    - uses: actions/checkout@v2
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - run: |
        set -euo pipefail
        tag="ghcr.io/eoap/application-package-patterns/${{ matrix.image_name }}:${{needs.version.outputs.publish-tag}}"
        docker pull "${tag}"
        shatag="$(docker inspect "${tag}" | yq -r '.[0]["RepoDigests"][0]')"
        yq -i eval '.requirements.DockerRequirement.dockerPull = strenv(shatag)' "${{ matrix.template_file }}"
    - name: Cleanup downloads folder
      run: rm -rf downloads/*
    - run: |
        mkdir -p downloads
        cp "${{ matrix.template_file }}" "downloads/${{ matrix.template_id }}.${{needs.version.outputs.publish-tag}}.cwl"
    - uses: actions/upload-artifact@v4
      with:
        name: application-package-${{ matrix.template_id }}
        path: downloads
        overwrite: true
    - name: upload template release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        upload_url: ${{needs.create-release.outputs.upload_url}}
        asset_path: downloads/${{ matrix.template_id }}.${{needs.version.outputs.publish-tag}}.cwl
        asset_name: ${{ matrix.template_id }}.${{needs.version.outputs.publish-tag}}.cwl
        asset_content_type: text/yaml
    - name: Setup ORAS CLI
      uses: oras-project/setup-oras@v1
    - name: Push template CWL as OCI Artifact to GHCR
      run: |
        set -euo pipefail
        cd downloads
        FILE=${{ matrix.template_id }}.${{needs.version.outputs.publish-tag}}.cwl
        NAME=ghcr.io/eoap/application-package-patterns/${{ matrix.template_id }}:${{needs.version.outputs.publish-tag}}

        echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

        oras push "$NAME" \
          --artifact-type application/cwl \
          "$FILE:application/cwl"
